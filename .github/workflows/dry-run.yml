
name: Chrome Hearts Safe Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test product discovery without notifications
        env:
          DRY_RUN: "1"
        run: python3 check_products.py
