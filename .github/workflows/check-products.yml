
name: Check Chrome Hearts Products


on:
  workflow_dispatch:
  schedule:
  - cron: "3-59/5 * * * *"


permissions:
  contents: write

concurrency:
  group: chrome-hearts-monitor
  cancel-in-progress: false

jobs:
  check-products:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check website and notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 check_products.py

      - name: Save product history
        run: |
          if [ -f products.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products.json
            if ! git diff --cached --quiet; then
              git commit -m "Update monitored products"
              git push
            fi
          fi

